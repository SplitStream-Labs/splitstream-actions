name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    # This is the check-run context the `main` ruleset requires; renaming it
    # blocks every PR, so the name must stay "npm run check".
    name: npm run check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, unit tests, and ncc build
        run: npm run check

  contract:
    name: Soroban contract
    runs-on: ubuntu-latest
    env:
      # SDK 29 refuses to produce a deployable artifact under an older CLI.
      STELLAR_CLI_VERSION: 30.0.1
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: clippy, rustfmt

      - name: Install stellar-cli (prebuilt binary)
        run: |
          curl -sL -o /tmp/stellar-cli.tar.gz \
            "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tar xzf /tmp/stellar-cli.tar.gz -C /tmp
          mkdir -p "$HOME/.local/bin"
          cp /tmp/stellar "$HOME/.local/bin/stellar"
          chmod +x "$HOME/.local/bin/stellar"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          stellar --version

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Contract tests (incl. cross-language Merkle fixture)
        run: cargo test --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The deployable artifact is a different build path from `cargo test`; it
      # must be exercised separately so a broken wasm fails CI, not a release.
      - name: Build contract wasm
        run: stellar contract build --package splitstream-vault